<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AICTE - Integrated Complaint Monitoring & Overlap Detection System</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            aicte: {
              navy: '#0b2545',
              dark: '#13293d',
              accent: '#ff9933', // Indian saffron
              green: '#138808', // Indian green
              light: '#f4f6f9',
              border: '#d2d6dc'
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .badge-overdue { background-color: #fee2e2; color: #b91c1c; border: 1px solid #f87171; }
    .badge-overlap { background-color: #fef3c7; color: #92400e; border: 1px solid #f59e0b; }
    .badge-normal { background-color: #e0f2fe; color: #0369a1; }
    .pulse-dot { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
  </style>
</head>
<body class="text-slate-800 antialiased flex flex-col min-h-screen">

  <div id="app"></div>

  <!-- Main Application Script -->
  <script src="/app.js"></script>
</body>
</html>
